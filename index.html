
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprende+ | Tutoriais</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:white;font-family:Arial,sans-serif}
header{height:65px;background:#181818;display:flex;align-items:center;
justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:bold;color:#38d9a9}
button{background:#38d9a9;color:#07130f;border:0;padding:11px 17px;
border-radius:7px;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;
border:1px solid #444;border-radius:7px;background:#222;color:white}
main{max-width:1200px;margin:auto;padding:22px}
.auth{max-width:420px;margin:35px auto;background:#1b1b1b;padding:22px;border-radius:12px}
.auth h2{text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap}
#status{color:#38d9a9;min-height:22px}
#videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.video-card{background:#1c1c1c;padding:10px;border-radius:10px;overflow:hidden}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:7px}
.video-card h3{margin:10px 0 5px}
.muted{color:#aaa;font-size:13px}
#uploadBox{background:#1b1b1b;padding:20px;border-radius:10px;margin:25px 0}
.hidden{display:none}
@media(max-width:600px){header{padding:0 12px}main{padding:13px}}
</style>
</head>
<body>

<header>
  <div class="logo">Aprende+</div>
  <div class="actions">
    <button id="loginButton">Entrar</button>
    <button id="logoutButton" class="hidden">Sair</button>
  </div>
</header>

<main>
  <section id="authBox" class="auth">
    <h2>Entre no Aprende+</h2>
    <p class="muted">Crie sua conta ou entre para publicar tutoriais.</p>
    <label>E-mail</label>
    <input id="email" type="email" placeholder="seuemail@exemplo.com">
    <label>Senha</label>
    <input id="password" type="password" placeholder="Sua senha">
    <div class="actions">
      <button id="signupButton">Criar conta</button>
      <button id="signinButton">Entrar</button>
    </div>
    <p id="authMessage"></p>
  </section>

  <section id="uploadBox" class="hidden">
    <h2>Publicar tutorial</h2>
    <label>Título do vídeo</label>
    <input id="title" maxlength="100" placeholder="Ex.: Como desenhar um personagem">
    <label>Descrição</label>
    <textarea id="description" rows="3" maxlength="1000"
      placeholder="Conte sobre o tutorial..."></textarea>
    <label>Categoria</label>
    <select id="category">
      <option>Geral</option>
      <option>Tecnologia</option>
      <option>Estudos</option>
      <option>Jogos</option>
      <option>Desenho e arte</option>
      <option>Ciência</option>
      <option>DIY</option>
    </select>
    <label>Arquivo de vídeo</label>
    <input id="videoFile" type="file" accept="video/*">
    <button id="publishButton">Publicar vídeo</button>
    <p id="uploadMessage"></p>
  </section>

  <h1>Tutoriais recentes</h1>
  <p class="muted">Aprenda algo novo com a comunidade Aprende+.</p>
  <div id="videos"></div>
  <p id="emptyMessage" class="muted"></p>
</main>

<script>
const SUPABASE_URL = "https://rpkkfxtyyfgroauxrdvl.supabase.co";

// Cole aqui sua Publishable key completa (sb_publishable_...)
const SUPABASE_KEY = "sb_publishable_gZyFDvk4kekfGqGR1jn0FA_P6OCLCwC";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

let currentUser = null;

function message(id, text) {
  $(id).textContent = text;
}

function showUser(user) {
  currentUser = user;
  $("authBox").classList.toggle("hidden", !!user);
  $("uploadBox").classList.toggle("hidden", !user);
  $("loginButton").classList.toggle("hidden", !!user);
  $("logoutButton").classList.toggle("hidden", !user);
}

async function signUp() {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || password.length < 6) {
    message("authMessage", "Informe um e-mail e uma senha com pelo menos 6 caracteres.");
    return;
  }

  message("authMessage", "Criando sua conta...");
  const { data, error } = await db.auth.signUp({ email, password });

  if (error) return message("authMessage", error.message);

  message("authMessage",
    data.session
      ? "Conta criada! Você já pode publicar."
      : "Conta criada! Confira seu e-mail para confirmar o cadastro."
  );
}

async function signIn() {
  const email = $("email").value.trim();
  const password = $("password").value;

  message("authMessage", "Entrando...");
  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) return message("authMessage", error.message);
  message("authMessage", "Login realizado!");
}

async function signOut() {
  const { error } = await db.auth.signOut();
  if (error) alert(error.message);
}

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[char]));
}

async function loadVideos() {
  $("videos").innerHTML = "";
  message("emptyMessage", "Carregando vídeos...");

  const { data, error } = await db
    .from("videos")
    .select("id,title,description,category,storage_path,created_at")
    .order("created_at", { ascending: false });

  if (error) {
    message("emptyMessage", "Não foi possível carregar os vídeos: " + error.message);
    return;
  }

  if (!data || data.length === 0) {
    message("emptyMessage", "Ainda não há vídeos publicados. Seja o primeiro a compartilhar um tutorial!");
    return;
  }

  message("emptyMessage", "");

  data.forEach(video => {
    const { data: urlData } = db.storage
      .from("videos")
      .getPublicUrl(video.storage_path);

    const card = document.createElement("article");
    card.className = "video-card";
    card.innerHTML = `
      <video controls preload="metadata"
        src="${safeText(urlData.publicUrl)}"></video>
      <h3>${safeText(video.title)}</h3>
      <p class="muted">${safeText(video.category || "Geral")}</p>
      <p>${safeText(video.description || "")}</p>
      <p class="muted">${new Date(video.created_at).toLocaleDateString("pt-BR")}</p>
    `;
    $("videos").appendChild(card);
  });
}

async function publishVideo() {
  if (!currentUser) {
    message("uploadMessage", "Entre na sua conta primeiro.");
    return;
  }

  const title = $("title").value.trim();
  const description = $("description").value.trim();
  const category = $("category").value;
  const file = $("videoFile").files[0];

  if (!title || !file) {
    message("uploadMessage", "Preencha o título e escolha um vídeo.");
    return;
  }

  if (!file.type.startsWith("video/")) {
    message("uploadMessage", "Escolha um arquivo de vídeo válido.");
    return;
  }

  const button = $("publishButton");
  button.disabled = true;
  message("uploadMessage", "Enviando vídeo para a nuvem... Aguarde.");

  try {
    const extension = file.name.split(".").pop().toLowerCase().replace(/[^a-z0-9]/g, "");
    const path = `${currentUser.id}/${crypto.randomUUID()}.${extension || "mp4"}`;

    const { error: uploadError } = await db.storage
      .from("videos")
      .upload(path, file, {
        contentType: file.type,
        upsert: false
      });

    if (uploadError) throw uploadError;

    const { error: insertError } = await db
      .from("videos")
      .insert({
        user_id: currentUser.id,
        title,
        description,
        category,
        storage_path: path
      });

    if (insertError) {
      // Tenta remover o arquivo caso o cadastro do vídeo falhe.
      await db.storage.from("videos").remove([path]);
      throw insertError;
    }

    message("uploadMessage", "Vídeo publicado com sucesso!");
    $("title").value = "";
    $("description").value = "";
    $("videoFile").value = "";
    await loadVideos();

  } catch (error) {
    message("uploadMessage", "Erro ao publicar: " + error.message);
  } finally {
    button.disabled = false;
  }
}

$("signupButton").addEventListener("click", signUp);
$("signinButton").addEventListener("click", signIn);
$("logoutButton").addEventListener("click", signOut);
$("publishButton").addEventListener("click", publishVideo);
$("loginButton").addEventListener("click", () => {
  $("authBox").scrollIntoView({ behavior: "smooth" });
});

db.auth.onAuthStateChange((_event, session) => {
  showUser(session?.user ?? null);
});

async function start() {
  const { data, error } = await db.auth.getSession();
  if (error) console.error(error);
  showUser(data.session?.user ?? null);
  await loadVideos();
}

start();
</script>
</body>
</html>
